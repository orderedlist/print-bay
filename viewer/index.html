<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Prints</title>
<style>
  :root {
    --bg: #f4f3f0; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66;
    --line: #e2e0db; --accent: #d9622b; --stage: #ebeae6; --grid: #c9c7c1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecebe7; --muted: #9a9993;
      --line: #2e2e2b; --accent: #f08048; --stage: #121211; --grid: #34342f;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    display: grid; grid-template-columns: 340px 1fr; height: 100vh;
  }
  aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; }
  header { padding: 20px 20px 12px; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0 10px 10px; }
  li button {
    all: unset; box-sizing: border-box; width: 100%; cursor: pointer;
    display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center;
    padding: 10px; border-radius: 8px;
  }
  li button:hover { background: var(--bg); }
  li button[aria-current="true"] { background: var(--bg); box-shadow: inset 2px 0 0 var(--accent); }
  li button:focus-visible { outline: 2px solid var(--accent); }
  .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); }
  .name { font-weight: 600; }
  .kind { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); text-transform: uppercase; }
  #detail { border-top: 1px solid var(--line); padding: 16px 20px 24px; }
  #detail h2 { margin: 0 0 10px; font-size: 15px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-variant-numeric: tabular-nums; }
  .job { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .job code { font-size: 12px; }
  .muted { color: var(--muted); }
  .rates { color: var(--muted); font-size: 12px; margin: -4px 0 12px; }
  .source { color: var(--muted); font-size: 13px; }
  .source h1 { display: none; }
  .source ul { padding-left: 18px; list-style: disc; }
  .source code { font-size: 12px; }
  .source a { color: var(--accent); }
  main { position: relative; background: var(--stage); min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #status {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); pointer-events: none;
  }
  #status[hidden] { display: none; }
  .modes {
    position: absolute; top: 14px; left: 14px; display: flex; padding: 3px; gap: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
  }
  .modes button {
    all: unset; cursor: pointer; padding: 5px 12px; border-radius: 6px; font-size: 13px; color: var(--muted);
  }
  .modes button[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }
  .modes button:disabled { cursor: default; opacity: 0.45; }
  .modes button:focus-visible { outline: 2px solid var(--accent); }
  #paths-ui {
    position: absolute; left: 14px; bottom: 14px; width: min(320px, calc(100% - 28px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    font-size: 13px;
  }
  #paths-ui[hidden] { display: none; }
  #paths-ui input[type=range] { width: 100%; accent-color: var(--accent); margin: 6px 0 2px; }
  .layer-row { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .toggles { display: flex; gap: 16px; }
  .layer-row label { color: var(--ink); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px; margin-top: 10px; }
  #legend label { display: flex; gap: 7px; align-items: center; cursor: pointer; white-space: nowrap; }
  #legend input { margin: 0; accent-color: var(--accent); }
  #legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  #hint { position: absolute; right: 14px; bottom: 12px; color: var(--muted); font-size: 12px; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; height: auto; }
    main { grid-row: 1; height: 55vh; }
    aside { border-right: 0; }
  }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.0/lib/marked.esm.js"
  } }
</script>
</head>
<body>
<aside>
  <header>
    <h1>3D Prints</h1>
    <p>Creality K2 · 260 × 260 mm bed</p>
  </header>
  <ul id="list"></ul>
  <section id="detail" hidden></section>
</aside>
<main>
  <canvas id="stage"></canvas>
  <div id="status">Loading…</div>
  <div class="modes">
    <button data-mode="model" aria-pressed="true">Model</button>
    <button data-mode="paths" aria-pressed="false" disabled>Toolpaths</button>
  </div>
  <div id="paths-ui" hidden>
    <div class="layer-row"><span id="layer-label"></span>
      <span class="toggles">
        <label><input type="checkbox" id="xray" checked> X-ray</label>
        <label><input type="checkbox" id="single"> This layer only</label>
      </span></div>
    <input type="range" id="layer" min="0" value="0" aria-label="Layer">
    <div id="legend"></div>
    <div class="note">As sliced, in print orientation. X-ray fades the walls so infill shows through. Arrow keys step layers.</div>
  </div>
  <div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { marked } from "marked";

const BED = 260;
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const $ = sel => document.querySelector(sel);

const canvas = $("#stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000);
camera.up.set(0, 0, 1);  // models are Z-up
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-300, -400, 600);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(400, 300, 200);
scene.add(rim);

let bed;
function buildBed() {
  if (bed) scene.remove(bed);
  bed = new THREE.Group();
  const grid = new THREE.GridHelper(BED, 13, css("--grid"), css("--grid"));
  grid.rotation.x = Math.PI / 2;
  const edge = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(BED, BED)),
    new THREE.LineBasicMaterial({ color: css("--muted") }));
  bed.add(grid, edge);
  scene.add(bed);
  scene.background = new THREE.Color(css("--stage"));
}
buildBed();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", buildBed);

function resize() {
  const { clientWidth: w, clientHeight: h } = canvas.parentElement;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

// Very dark filament disappears against the stage; lift it just enough to read.
function displayColor(hex) {
  const c = new THREE.Color(hex || "#9a9a96");
  const hsl = c.getHSL({});
  if (hsl.l < 0.18) c.setHSL(hsl.h, hsl.s, 0.18);
  return c;
}

const loader = new STLLoader();
let mesh;
async function show(model) {
  const status = $("#status");
  status.textContent = model.kind === "scad" ? "Rendering with OpenSCAD…" : "Loading…";
  status.hidden = false;
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh = null; }

  const res = await fetch(`/mesh/${encodeURIComponent(model.id)}`);
  if (!res.ok) { status.textContent = `Couldn't load: ${await res.text()}`; return null; }
  const geom = loader.parse(await res.arrayBuffer());
  geom.computeBoundingBox();
  const box = geom.boundingBox;
  const center = box.getCenter(new THREE.Vector3());
  geom.translate(-center.x, -center.y, -box.min.z);  // centered on the bed
  geom.computeVertexNormals();
  geom.computeBoundingBox();

  const hex = model.jobs[0]?.hex;
  mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
    color: displayColor(hex), roughness: 0.65, metalness: 0.05,
  }));
  scene.add(mesh);
  status.hidden = true;
  frameMesh();
  return box.getSize(new THREE.Vector3());
}

function frameMesh() {
  if (!mesh) return;
  const size = mesh.geometry.boundingBox.getSize(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z, 60);
  camera.position.set(-r * 1.4, -r * 1.9, size.z / 2 + r * 1.1);
  controls.target.set(0, 0, size.z / 2);
  controls.update();
}

// ---- Toolpaths (the sliced G-code, colored by feature) ----
const FEATURE_COLORS = {
  "Outer wall": "#ff8a3d", "Inner wall": "#ffd84a", "Overhang wall": "#3d5afe",
  "Sparse infill": "#c2362f", "Internal solid infill": "#a05cd6", "Gap infill": "#e8e8e8",
  "Top surface": "#ff5c8a", "Bottom surface": "#5aa9e6", "Bridge": "#3f7fc0",
  "Internal Bridge": "#9cc9ef", "Brim": "#2f9e6e", "Support": "#4caf50",
  "Support interface": "#2e7d32", "Custom": "#7aa6a8",
};
const hidden = new Set(["Brim", "Custom"]);
const WALLS = new Set(["Outer wall", "Inner wall", "Overhang wall"]);
const paths = new THREE.Group();
scene.add(paths);
let pathData = null;  // { layers, types: [{ name, layerStarts, line }] }
let mode = "model";

async function loadPaths(job) {
  paths.children.forEach(c => c.geometry.dispose());
  paths.clear();
  pathData = null;
  if (!job) return false;
  const res = await fetch(`/toolpaths/${encodeURIComponent(job)}`);
  if (!res.ok) return false;
  const buf = await res.arrayBuffer();
  const n = new DataView(buf).getUint32(0, true);
  const meta = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, n)));
  const all = new Float32Array(buf, 4 + n);
  for (const t of meta.types) {
    const geom = new THREE.BufferGeometry();
    geom.setAttribute("position", new THREE.BufferAttribute(all.subarray(t.offset * 6, (t.offset + t.count) * 6), 3));
    t.line = new THREE.LineSegments(geom, new THREE.LineBasicMaterial({
      color: FEATURE_COLORS[t.name] || "#999", transparent: true }));
    paths.add(t.line);
  }
  paths.position.set(-BED / 2, -BED / 2, 0);  // G-code is in bed coordinates
  pathData = meta;

  const slider = $("#layer");
  slider.max = meta.layers.length - 1;
  slider.value = meta.layers.length - 1;
  $("#legend").innerHTML = meta.types.map(t => `
    <label><input type="checkbox" data-type="${t.name}" ${hidden.has(t.name) ? "" : "checked"}>
      <i style="background:${FEATURE_COLORS[t.name] || "#999"}"></i>${t.name}</label>`).join("");
  updatePaths();
  return true;
}

function updatePaths() {
  if (!pathData) return;
  const layer = +$("#layer").value;
  const single = $("#single").checked;
  const xray = $("#xray").checked && !single;  // a single layer is already a cross-section
  for (const t of pathData.types) {
    const from = single ? t.layerStarts[layer] : 0;
    const to = t.layerStarts[layer + 1];
    t.line.geometry.setDrawRange(from * 2, (to - from) * 2);
    t.line.visible = !hidden.has(t.name);
    const faded = xray && WALLS.has(t.name);
    t.line.material.opacity = faded ? 0.06 : 1;
    t.line.material.depthWrite = !faded;
    t.line.renderOrder = faded ? 1 : 0;  // draw faded walls after what they cover
  }
  $("#layer-label").textContent =
    `Layer ${layer + 1} / ${pathData.layers.length} · Z ${pathData.layers[layer].toFixed(2)} mm`;
}

$("#layer").addEventListener("input", updatePaths);
$("#single").addEventListener("change", () => { updatePaths(); framePaths(); });
$("#xray").addEventListener("change", updatePaths);
$("#legend").addEventListener("change", e => {
  const name = e.target.dataset.type;
  e.target.checked ? hidden.delete(name) : hidden.add(name);
  updatePaths();
});
addEventListener("keydown", e => {
  if (mode !== "paths" || !["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) return;
  if (e.target.matches("input[type=range]")) return;  // the slider handles its own keys
  const s = $("#layer");
  s.value = +s.value + (e.key === "ArrowUp" || e.key === "ArrowRight" ? 1 : -1);
  updatePaths();
  e.preventDefault();
});

// Bounds of the part itself, from the drawn segments: brim, purge lines and
// supports are left out so they don't pull the framing off the part.
const NOT_PART = new Set(["Brim", "Custom", "Support", "Support interface", "Support transition"]);
function partBounds(fromLayer, toLayer) {
  const box = new THREE.Box3();
  const p = new THREE.Vector3();
  for (const t of pathData.types) {
    if (NOT_PART.has(t.name)) continue;
    const pos = t.line.geometry.attributes.position.array;
    for (let i = t.layerStarts[fromLayer] * 6; i < t.layerStarts[toLayer] * 6; i += 3)
      box.expandByPoint(p.set(pos[i], pos[i + 1], pos[i + 2]));
  }
  return box.translate(paths.position);
}

// Whole print: three-quarter view. Single layer: straight down onto it.
function framePaths() {
  if (!pathData) return;
  const layer = +$("#layer").value;
  const single = $("#single").checked;
  const whole = partBounds(0, pathData.layers.length);
  let box = single ? partBounds(layer, layer + 1) : whole;
  if (box.isEmpty()) {  // e.g. a support-only layer: frame the part's outline at this height
    const z = pathData.layers[layer];
    box = whole.clone();
    box.min.z = box.max.z = z;
  }
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  if (single) {
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const fit = Math.max(size.x / camera.aspect, size.y, 20) / 2 / Math.tan(fov / 2);
    controls.target.copy(center);
    camera.position.set(center.x, center.y - 1, center.z + fit * 1.15);
  } else {
    const r = Math.max(size.x, size.y, size.z, 60);
    controls.target.copy(center);
    camera.position.set(center.x - r * 1.6, center.y - r * 2.2, center.z + r * 1.6);
  }
  controls.update();
}
function setMode(next) {
  mode = next;
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  if (mesh) mesh.visible = mode === "model";
  paths.visible = mode === "paths";
  $("#paths-ui").hidden = mode !== "paths";
  $("#hint").hidden = mode === "paths";
  if (mode === "paths") {
    framePaths();
  } else if (mode === "model") {
    frameMesh();
  }
}
document.querySelectorAll(".modes button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));

const money = (n) => `$${n.toFixed(2)}`;
const fmt = (mm) => `${mm.toFixed(1)} mm`;
const inch = (mm) => `${(mm / 25.4).toFixed(2)}″`;

function renderDetail(model, size) {
  const el = $("#detail");
  const dims = size ? `
    <dl>
      <dt>Width</dt><dd>${fmt(size.x)} · ${inch(size.x)}</dd>
      <dt>Depth</dt><dd>${fmt(size.y)} · ${inch(size.y)}</dd>
      <dt>Height</dt><dd>${fmt(size.z)} · ${inch(size.z)}</dd>
      <dt>File</dt><dd><code>${model.file}</code></dd>
    </dl>` : "";
  const jobs = model.jobs.map(j => `
    <div class="job">
      <dl>
        <dt>Job</dt><dd><code>${j.file}</code></dd>
        <dt>Color</dt><dd><span class="swatch" style="display:inline-block;vertical-align:-2px;background:${j.hex || "transparent"}"></span> ${j.color || "—"}</dd>
        <dt>Copies</dt><dd>${j.copies}</dd>
        <dt>Last slice</dt><dd>${j.stats ? `${j.stats.time} · ${Math.round(j.stats.grams)} g` : "not sliced"}</dd>
        ${j.stats ? `
        <dt>Cost</dt><dd><strong>${money(j.stats.cost.total)}</strong> each
          <span class="muted">(${money(j.stats.cost.filament)} filament + ${money(j.stats.cost.power)} power)</span></dd>
        ${j.copies > 1 ? `<dt>All ${j.copies}</dt><dd>${money(j.stats.cost.total * j.copies)}</dd>` : ""}` : ""}
      </dl>
      <code>python scripts/run.py ${j.file}</code>
    </div>`).join("") || `<p class="source">No job prints this model yet.</p>`;
  const rateNote = model.jobs.some(j => j.stats) ? `<p class="rates">At $${rates.filament_per_kg}/kg filament,
    ${rates.printer_watts} W × $${rates.power_per_kwh}/kWh · edit <code>costs.toml</code></p>` : "";
  el.innerHTML = `<h2>${model.id}</h2>${dims}${jobs}${rateNote}<div class="source">${marked.parse(model.source)}</div>`;
  el.hidden = false;
}

async function select(model, button) {
  document.querySelectorAll("li button").forEach(b => b.setAttribute("aria-current", b === button));
  history.replaceState(null, "", `#${model.id}`);
  renderDetail(model, null);
  const sliced = model.jobs.find(j => j.stats);
  const pathsButton = $('.modes button[data-mode="paths"]');
  pathsButton.disabled = true;
  pathsButton.title = sliced ? "" : "Slice a job for this model to see its toolpaths";
  const [size, hasPaths] = await Promise.all([show(model), loadPaths(sliced?.name)]);
  pathsButton.disabled = !hasPaths;
  setMode(hasPaths && mode === "paths" ? "paths" : "model");
  renderDetail(model, size);
}

const [models, rates] = await Promise.all(
  ["/api/models", "/api/rates"].map(async url => (await fetch(url)).json()));
const list = $("#list");
for (const model of models) {
  const li = document.createElement("li");
  const b = document.createElement("button");
  const hex = model.jobs[0]?.hex;
  b.innerHTML = `<span class="swatch" style="background:${hex || "transparent"}"></span>
    <span class="name">${model.id}</span><span class="kind">${model.kind || "no mesh"}</span>`;
  b.disabled = !model.file;
  b.addEventListener("click", () => select(model, b));
  li.append(b);
  list.append(li);
}
const first = models.find(m => m.id === location.hash.slice(1)) || models.find(m => m.file);
const buttonFor = model => list.children[models.indexOf(model)].firstChild;
if (first) select(first, buttonFor(first));
else $("#status").textContent = "No models yet — add a folder under models/.";
addEventListener("hashchange", () => {
  const model = models.find(m => m.id === location.hash.slice(1) && m.file);
  if (model) select(model, buttonFor(model));
});
</script>
</body>
</html>
